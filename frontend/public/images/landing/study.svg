      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#fff" fill-opacity=".12"/>
