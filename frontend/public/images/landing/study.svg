  <text x="300" y="572" text-anchor="middle" font-size="25" fill="#fff" fill-opacity=".9">Pomodoro và streak mỗi ngày</text>
  <text x="300" y="642" text-anchor="middle" font-size="18" letter-spacing="2" fill="#fff" fill-opacity=".7">DÀNH CHO SINH VIÊN .EDU.VN</text>
